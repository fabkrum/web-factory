<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Small layout shift fixture: about</title>
    <style>
      body { font-family: system-ui, sans-serif; color: #1a1a1a; background: #ffffff; }
      a { color: #0b4fa8; }
      main { min-height: 100vh; }
      .banner { height: 45px; margin: 0; background: #fff4c2; }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Main">
        <a href="/">Home</a>
        <a href="/about.html">About</a>
      </nav>
    </header>
    <main>
      <h1>About</h1>
      <p>A banner pushes this page down a little after it has loaded, within the layout shift budget.</p>
    </main>
    <script>
      // A banner arrives late, above the content, with no space kept for it.
      setTimeout(() => {
        const banner = document.createElement("p");
        banner.className = "banner";
        banner.textContent = "Spring sale";
        document.querySelector("main").before(banner);
      }, 500);
    </script>
  </body>
</html>
